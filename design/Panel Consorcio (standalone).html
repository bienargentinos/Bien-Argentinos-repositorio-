document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#2E6FC0;margin-bottom:10px\">Panel de administración<\u002Fdiv>\n      <h2 style=\"font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px\">Ingresá a tu cuenta<\u002Fh2>\n      <p style=\"color:#64748B;font-size:15px;margin:0 0 28px\">Usá el usuario y la contraseña de tu cuenta de administrador.<\u002Fp>\n\n      <label style=\"display:block;font-size:13px;font-weight:700;color:#334259;margin-bottom:7px\">Usuario<\u002Flabel>\n      <div style=\"position:relative;margin-bottom:18px\">\n        <span style=\"position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px\">👤<\u002Fspan>\n        <input value=\"{{ user }}\" oninput=\"{{ onUser }}\" placeholder=\"tu_usuario\" style=\"width:100%;height:48px;border:1.5px solid #DDE3EE;border-radius:11px;padding:0 14px 0 42px;font-size:15px;font-family:inherit;color:#16233B;outline:none;background:#F8FAFD\" style-focus=\"border-color:#2E6FC0;background:#fff;box-shadow:0 0 0 4px rgba(46,111,192,.12)\">\n      <\u002Fdiv>\n\n      <label style=\"display:block;font-size:13px;font-weight:700;color:#334259;margin-bottom:7px\">Contraseña<\u002Flabel>\n      <div style=\"position:relative;margin-bottom:16px\">\n        <span style=\"position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px\">🔒<\u002Fspan>\n        <input type=\"{{ passType }}\" value=\"{{ pass }}\" oninput=\"{{ onPass }}\" placeholder=\"••••••••\" style=\"width:100%;height:48px;border:1.5px solid #DDE3EE;border-radius:11px;padding:0 70px 0 42px;font-size:15px;font-family:inherit;color:#16233B;outline:none;background:#F8FAFD\" style-focus=\"border-color:#2E6FC0;background:#fff;box-shadow:0 0 0 4px rgba(46,111,192,.12)\">\n        <button onclick=\"{{ togglePass }}\" style=\"position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;color:#64748B;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;padding px\"><strong style=\"color:#334259\">Demo · cuentas de prueba:<\u002Fstrong> <code style=\"background:#E4ECF7;padding:1px 5px;border-radius:4px\">daniel / sistema2025<\u002Fcode> (dueño) · <code style=\"background:#E4ECF7;padding:1px 5px;border-radius:4px\">amato_admin / demo1234<\u002Fcode> (cliente). O entrá directo 👇<\u002Fdiv>\n        <div style=\"display:flex;gap:9px\">\n          <button onclick=\"{{ loginCliente }}\" style=\"flex:1;height:40px;border:1px solid #DCE4F0;border-radius:9px;background:#fff;color:#2E6FC0;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit\" style-hover=\"background:#EAF1FB;border-color:#B9CBE6\">🏢 Admin de edificio<\u002Fbutton>\n          <button onclick=\"{{ loginDueno }}\" style=\"flex:1;height:40px;border:1px solid #DCE4F0;border-radius:9px;background:#fff;color:#17408B;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit\" style-hover=\"background:#EAF1FB;border-color:#B9CBE6\">🗂️ Admin de sistema<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <!-- RECUPERAR -->\n      <sc-if value=\"{{ authForgot }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:52px;height:52px;border-radius:14px;background:#EAF1FB;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:18px\">🔑<\u002Fdiv>\n      <h2 style=\"font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px\">Recuperar contraseña<\u002Fh2>\n      <p style=\"color:#64748B;font-size:15px;margin:0 0 26px\">Ingresá el email de tu cuenta y te mandamos un link para crear una nueva contraseña.<\u002Fp>\n      <label style=\"display:block;font-size:13px;font-weight:700;color:#334259;margin-bottom:7px\">Email<\u002Flabel>\n      <div style=\"position:relative;margin-bottom:22px\">\n        <span style=\"position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px\">✉️<\u002Fspan>\n        <input value=\"{{ fEmail }}\" oninput=\"{{ onFE Fbutton>\n      <\u002Fsc-if>\n\n      <!-- ACTIVAR -->\n      <sc-if value=\"{{ authActivate }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#2E6FC0;margin-bottom:10px\">Primer acceso<\u002Fdiv>\n      <h2 style=\"font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px\">Activá tu cuenta<\u002Fh2>\n      <p style=\"color:#64748B;font-size:15px;margin:0 0 24px\">Tu administrador creó tu usuario. Elegí una contraseña para empezar a usar el panel.<\u002Fp>\n      <label style=\"display:block;font-size:13px;font-weight:700;color:#334259;margin-bottom:7px\">Usuario<\u002Flabel>\n      <input value=\"{{ actUser }}\" oninput=\"{{ onActUser }}\" placeholder=\"tu_usuario\" style=\"width:100%;height:46px;border:1.5px solid #DDE3EE;border-radius:11px;padding:0 14px;font-size:15px;font-family:inherit;color:#16233B;outline:none;background:#F8FAFD;margin-bottom:14px\" style-focus=\"border-color:#2E6FC0;background:#fff;box-shadow:0 0 0 4px rgba(46,111,192,.12)\">\n      <label style=\"display:block;font-size:13px;font-weight:700;color:#334259;margin-bottom:7px\">Nueva contraseña<\u002Flabel>\n      <input type=\"password\" value=\"{{ actPass }}\" oninput=\"{{ onActPass }}\" placeholder=\"Mínimo 6 caracteres\" style=\"width:100%;height:46px;border:1.5px solid #DDE3EE;border-radius:11px;padding:0 14px;font-size:15px;font-family:inherit;color:#16233B;outline:none;background:#F8FAFD;margin-bottom:14px\" style-focus=\"border-color:#2E6FC0;background:#fff;box-shadow:0 0 0 4px rgba(46,111,192,.12)\">\n      <label style=\"display:block;font-size:13px;font-weight:700;color:#334259;margin-bottom:7px\">Repetir contraseña<\u002Flabel>\n      <input type=\"password\" value=\"{{ actPass2 }}\" oninput=\"{{ onActPass2 }}\" placeholder=\"Repetí la contraseña\" style=\"width:100%;height:46px;border:1.5px solid #DDE3EE;border-radius:11px;padding:0 14px;font-size:15px;font-family:inherit;co laceholder-val=\"{{ false }}\"><span style=\"position:absolute;left:0;top:0;bottom:0;width:3px;background:#2E6FC0\"><\u002Fspan><\u002Fsc-if>\n              <span style=\"width:44px;height:44px;border-radius:12px;background:{{ e.tipoBg }};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0\">{{ e.icon }}<\u002Fspan>\n              <span style=\"flex:1;min-width:0\">\n                <span style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap\">\n                  <span style=\"font-size:15px;font-weight:700;color:#16233B\">{{ e.titulo }}<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:{{ e.urgBg }};color:{{ e.urgFg }}\">{{ e.urgLabel }}<\u002Fspan>\n                  <sc-if value=\"{{ e.nuevo }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px;font-weight:800;color:#2E6FC0\">● NUEVO<\u002Fspan><\u002Fsc-if>\n                <\u002Fspan>\n                <span style=\"display:block;font-size:13.5px;color:#5A6B85;line-height:1.45;margin-bottom:6px\">{{ e.detalle }}<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:10px;font-size:12px;color:#9AA7BD;flex-wrap:wrap\">\n                  <span>{{ e.canalIcon }} {{ e.canal }}<\u002Fspan><span>·<\u002Fspan><span>{{ e.unidad }}<\u002Fspan><span>·<\u002Fspan><span>{{ e.when }}<\u002Fspan>\n                  <sc-if value=\"{{ e.hasConv }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#2E6FC0;font-weight:700\">{{ e.convTag }}<\u002Fspan><\u002Fsc-if>\n                <\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:{{ e.estBg }};color:{{ e.estFg }};flex-shrink:0\">{{ e.estLabel }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ======= MI EDIFICIO ======= -->\n      <sc-if value=\"{{ secEdificio }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mFade .3s ease both\">\n        <h1 style=\"font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px\">Mi Edificio<\u002Fh1>\n        <p style=\"color:#64748B;font-size:15px;margin:0 0 20px\">Ficha de {{ curBuilding.name }}. Esta información es de consulta: si algo está desactualizado, tocá <strong style=\"color:#334259\">Solicitar cambio<\u002Fstrong> y tu administrador lo revisa.<\u002Fp>\n\n        <sc-if value=\"{{ hasPending }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#FBF3DE;border:1px solid #F0DCA6;border-radius:14px;padding:14px 18px;margin-bottom:20px\">\n            <div style=\"font-size:14px;font-weight:800;color:#8A6410;margin-bottom:8px\">⏳ Cambios pendientes de aprobación ({{ pendingCount }})<\u002Fdiv>\n            <sc-for list=\"{{ pendingList }}\" as=\"p\" hint-placeholder-count=\"1\">\n              <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#7A5A12;padding:3px 0\">\n                <span style=\"font-weight:700\">{{ p.label }}:<\u002Fspan>\n                <span style=\"text-decoration:line-through;opacity:.65\">{{ p.from }}<\u002Fspan>\n                <span>→<\u002Fspan>\n                <span style=\"font-weight:700\">{{ p.to }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\" class=\"fichagrid\">\n          <sc-for list=\"{{ fichaRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div style=\"background:#fff;border:1px solid #E7ECF3;border-radius:14px;padding:15px 17px;display:flex;align-items:center;gap:12px\">\n              <span style=\"width:40px;height:40px;border-radius:11px;background:#F1F5FB;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0\">{{ r.icon }}<\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:12px;font-weight:700;color:#8595AD;letter-spacing:.02em;text-transform:uppercase\">{{ r.label }}<\u002Fdiv>\n                <div style=\"font-size:15.5px;font-weight:700;color:#16233B;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.value }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ r.pending }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:#FBF3DE;color:#8A6410;flex-shrink:0\">Pendiente<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ r.editable }}\" hint-placeholder-val=\"{{ true }}\">\n                <button onclick=\"{{ r.onRequest }}\" style=\"flex-shrink:0;height:34px;padding:0 13px;border:1px solid #DCE4F0;border-radius:9px;background:#fff;color:#2E6FC0;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit\" style-hover=\"background:#F1F5FB;border-color:#B9CBE6\">Solicitar cambio<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ======= FACTURAS ======= -->\n      <sc-if value=\"{{ secFacturas }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mFade .3s ease both\">\n        <h1 style=\"font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px\">Facturas y Fotos<\u002Fh1>\n        <p style=\"color:#64748B;font-size:15px;margin:0 0 20px\">Comprobantes y archivos que vecinos y proveedores enviaron por WhatsApp, ordenados por Marcos.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px\">\n          <sc-for list=\"{{ facturasView }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border:1px solid #E7ECF3;border-radius:16px;overflow:hidden\">\n              <div style=\"height:120px;background:{{ f.thumbBg }};display:flex;align-items:center;justify-content:center;position:relative\">\n                <span style=\"font-size:40px\">{{ f.thumbIcon }}<\u002Fspan>\n                <span style=\"position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.9);color:#334259\">{{ f.tipo }}<\u002Fspan>\n                <span style=\"position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:{{ f.monBg }};color:{{ f.monFg }}\">{{ f.moneda }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:14px 16px\">\n                <div style=\"font-size:15px;font-weight:700;margin-bottom:2px\">{{ f.concepto }}<\u002Fdiv>\n                <div style=\"font-size:13px;color:#8595AD;margin-bottom:12px\">{{ f.proveedor }} · {{ f.fecha }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between\">\n                  <span style=\"font-size:19px;font-weight:800;letter-spacing:-.02em\">{{ f.monto }}<\u002Fspan>\n                  <span style=\"font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:{{ f.estBg }};color:{{ f.estFg }}\">{{ f.estado }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ======= EXPENSAS ======= -->\n      <sc-if value=\"{{ secExpensas }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mFade .3s ease both;max-width:820px\">\n        <h1 style=\"font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px\">Expensas<\u002Fh1>\n        <p style=\"color:#64748B;font-size:15px;margin:0 0 20px\">Subí las expensas del mes de {{ curBuilding.name }}. <strong style=\"color:#334259\">Marcos queda habilitado para compartirlas<\u002Fstrong> con los vecinos que las pidan por WhatsApp, o para enviarlas cuando vos se lo indiques.<\u002Fp>\n\n        <div style=\"background:#fff;border:1px solid #E7ECF3;border-radius:16px;padding:20px 22px;margin-bottom:26px\">\n          <div style=\"font-size:15px;font-weight:800;margin-bottom:14px\">Publicar nueva expensa<\u002Fdiv>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px\">\n            <div style=\"flex:1;min-width:130px\">\n              <div style=\"font-size:12px;font-weight:700;color:#8595AD;text-transform:uppercase;margin-bottom:6px\">Mes<\u002Fdiv>\n              <input value=\"{{ expMonth }}\" oninput=\"{{ onExpMonth }}\" style=\"width:100%;height:44px;border:1.5px solid #DDE3EE;border-radius:11px;padding:0 14px;font-size:15px;font-family:inherit;color:#16233B;outline:none;background:#F8FAFD\" style-focus=\"border-color:#2E6FC0;background:#fff;box-shadow:0 0 0 4px rgba(46,111,192,.1)\">\n            <\u002Fdiv>\n            <div style=\"width:110px\">\n              <div style=\"font-size:12px;font-weight:700;color:#8595AD;text-transform:uppercase;margin-bottom:6px\">Año<\u002Fdiv>\n              <input value=\"{{ expYear }}\" oninput=\"{{ onExpYear }}\" style=\"width:100%;height:44px;border:1.5px solid #DDE3EE;border-radius:11px;padding:0 14px;font-size:15px;font-family:inherit;color:#16233B;outline:none;background:#F8FAFD\" style-focus=\"border-color:#2E6FC0;background:#fff;box-shadow:0 0 0 4px rgba(46,111,192,.1)\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font-size:12px;font-weight:700;color:#8595AD;text-transform:uppercase;margin-bottom:6px\">Formato<\u002Fdiv>\n          <div style=\"display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap\">\n            <button onclick=\"{{ setExpPdf }}\" style=\"height:40px;padding:0 16px;border:1px solid {{ expPdfBorder }};border-radius:10px;background:{{ expPdfBg }};color:{{ expPdfFg }};font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit\">📄 PDF<\u002Fbutton>\n            <button onclick=\"{{ setExpImg }}\" style=\"height:40px;padding:0 16px;border:1px solid {{ expImgBorder }};border-radius:10px;background:{{ expImgBg }};color:{{ expImgFg }};font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit\">🖼️ Imagen<\u002Fbutton>\n            <button onclick=\"{{ setExpLink }}\" style=\"height:40px;padding:0 16px;border:1px solid {{ expLinkBorder }};border-radius:10px;background:{{ expLinkBg }};color:{{ expLinkFg }};font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit\">🔗 Link web<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ expIsLink }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12px;font-weight:700;color:#8595AD;text-transform:uppercase;margin-bottom:6px\">Dirección web<\u002Fdiv>\n            <input value=\"{{ expName }}\" oninput=\"{{ onExpName }}\" placeholder=\"https://...\" style=\"width:100%;height:46px;border:1.5px solid #DDE3EE;border-radius:11px;padding:0 14px;font-size:15px;font-family:inherit;color:#16233B;outline:none;background:#F8FAFD;margin-bottom:16px\" style-focus=\"border-color:#2E6FC0;background:#fff;box-shadow:0 0 0 4px rgba(46,111,192,.1)\">\n          <\u002Fsc-if>\n          <sc-if value=\"{{ expIsFile }}\" hint-placeholder-val=\"{{ true }}\">\n            <div onclick=\"{{ pickFile }}\" style=\"display:flex;align-items:center;gap:13px;border:1.5px dashed #C9D5E8;border-radius:12px;padding:16px;background:#F7F9FC;cursor:pointer;margin-bottom:16px\" style-hover=\"background:#EAF1FB;border-color:#2E6FC0\">\n              <span style=\"width:44px;height:44px;border-radius:11px;background:#EAF1FB;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0\">📎<\u002Fspan>\n              <div style=\"flex:1\">\n                <sc-if value=\"{{ hasExpName }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-size:14.5px;font-weight:700;color:#16233B\">{{ expName }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#1B7A43;font-weight:600\">Archivo listo · tocá Publicar<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ noExpName }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"font-size:14.5px;font-weight:700;color:#334259\">Elegí el archivo<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#8595AD\">Tocá para seleccionar el PDF o la imagen de las expensas<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <button onclick=\"{{ publishExp }}\" style=\"height:46px;padding:0 24px;border:none;border-radius:11px;background:linear-gradient(180deg,#2E6FC0,#1E5FB4);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;font-family:inherit\" style-hover=\"background:linear-gradient(180deg,#3579cd,#2464bd)\">Publicar para Marcos<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"font-size:15px;font-weight:800;margin-bottom:12px\">Expensas publicadas<\u002Fdiv>\n        <sc-if value=\"{{ hasExp }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ expView }}\" as=\"x\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:15px;background:#fff;border:1px solid #E7ECF3;border-radius:14px;padding:15px 18px;flex-wrap:wrap\">\n                <span style=\"width:46px;height:46px;border-radius:12px;background:{{ x.typeBg }};display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0\">{{ x.typeIcon }}<\u002Fspan>\n                <div style=\"flex:1;min-width:170px\">\n                  <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                    <span style=\"font-size:15.5px;font-weight:800\">{{ x.period }}<\u002Fspan>\n                    <span style=\"font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:{{ x.typeBg }};color:{{ x.typeFg }}\">{{ x.typeLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#8595AD;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px\">{{ x.name }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:#E7F4EC;color:#1B7A43\">✓ Marcos puede compartirla<\u002Fspan>\n                <div style=\"display:flex;gap:8px\">\n                  <button onclick=\"{{ x.onCopy }}\" style=\"height:36px;padding:0 13px;border:1px solid #DCE4F0;border-radius:9px;background:#fff;color:#2E6FC0;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit\" style-hover=\"background:#F1F5FB\">🔗 Copiar<\u002Fbutton>\n                  <button onclick=\"{{ x.onRemove }}\" style=\"height:36px;padding:0 13px;border:1px solid #EEDcdc;border-radius:9px;background:#fff;color:#C0392B;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit\" style-hover=\"background:#FDECEC\">Quitar<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noExp }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:36px 20px;background:#fff;border:1px dashed #DDE3EE;border-radius:14px;color:#8595AD;font-size:14px\">Todavía no publicaste expensas para este edificio.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ======= SUGERENCIAS ======= -->\n      <sc-if value=\"{{ secSugerencias }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mFade .3s ease both;max-width:720px\">\n        <h1 style=\"font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px\">Sugerencias<\u002Fh1>\n        <p style=\"color:#64748B;font-size:15px;margin:0 0 20px\">¿Se te ocurre algo para mejorar la atención de tu edificio? Escribile a tu administrador. Te responde por acá.<\u002Fp>\n        <div style=\"background:#fff;border:1px solid #E7ECF3;border-radius:16px;padding:18px 20px;margin-bottom:22px\">\n          <textarea value=\"{{ sugText }}\" oninput=\"{{ onSug }}\" placeholder=\"Ej: Sería útil recibir un aviso antes de los cortes de agua programados...\" style=\"width:100%;min-height:96px;border:1.5px solid #E1E7F1;border-radius:12px;padding:13px 15px;font-size:15px;font-family:inherit;color:#16233B;resize:vertical;outline:none;background:#F8FAFD;line-height:1.5\" style-focus=\"border-color:#2E6FC0;background:#fff;box-shadow:0 0 0 4px rgba(46,111,192,.1)\"><\u002Ftextarea>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:12px\">\n            <span style=\"font-size:13px;color:#9AA7BD\">Sobre {{ curBuilding.name }}<\u002Fspan>\n            <button onclick=\"{{ sendSug }}\" style=\"height:42px;padding:0 22px;border:none;border-radius:11px;background:linear-gradient(180deg,#2E6FC0,#1E5FB4);color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit\" style-hover=\"background:linear-gradient(180deg,#3579cd,#2464bd)\">Enviar sugerencia<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:14px;font-weight:800;color:#334259;margin-bottom:12px\">Historial<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ sugList }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid #E7ECF3;border-radius:14px;padding:16px 18px\">\n              <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:2px\">\n                <div style=\"font-size:14.5px;color:#16233B;line-height:1.5;flex:1\">{{ s.texto }}<\u002Fdiv>\n                <span style=\"font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:{{ s.stBg }};color:{{ s.stFg }};flex-shrink:0\">{{ s.estado }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:#9AA7BD;margin-bottom:10px\">Enviada el {{ s.fecha }}<\u002Fdiv>\n              <sc-if value=\"{{ s.hasReply }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;gap:10px;background:#F1F5FB;border-radius:11px;padding:12px 14px\">\n                  <span style=\"width:28px;height:28px;border-radius:50%;background:linear-gradient(140deg,#17408B,#2E6FC0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;flex-shrink:0\">D<\u002Fspan>\n                  <div>\n                    <div style=\"font-size:12px;font-weight:700;color:#2E6FC0;margin-bottom:2px\">Respuesta del administrador<\u002Fdiv>\n                    <div style=\"font-size:13.5px;color:#334259;line-height:1.5\">{{ s.respuesta }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ======= DUEÑO · RESUMEN ======= -->\n      <sc-if value=\"{{ secDResumen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mFade .3s ease both\">\n        <div style=\"margin-bottom:20px\">\n          <div style=\"font-size:13px;font-weight:700;color:#2E6FC0;margin-bottom:3px\">Buen día, Daniel 👋<\u002Fdiv>\n          <h1 style=\"font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0\">Panel general · todos los edificios<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px\">\n          <sc-for list=\"{{ dKpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n            <div style=\"background:#fff;border:1px solid #E7ECF3;border-radius:15px;padding:16px 18px;box-shadow:0 1px 2px rgba(16,35,59,.04)\">\n              <span style=\"width:38px;height:38px;border-radius:11px;background:{{ k.iconBg }};display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:11px\">{{ k.icon }}<\u002Fspan>\n              <div style=\"font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1\">{{ k.value }}<\u002Fdiv>\n              <div style=\"font-size:13px;color:#64748B;font-weight:600;margin-top:4px\">{{ k.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ excedeAlert }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#8A2A24,#C0392B);border-radius:15px;padding:16px 20px;color:#fff;margin-bottom:22px;flex-wrap:wrap\">\n            <span style=\"width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0\">🧾<\u002Fspan>\n            <div style=\"flex:1;min-width:200px\">\n              <div style=\"font-size:17px;font-weight:800\">{{ excedeMsg }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:rgba(255,255,255,.85)\">Excedente facturable acumulado: {{ facturableFmt }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button onclick=\"{{ goConsumos }}\" style=\"height:40px;padding:0 18px;border:none;border-radius:11px;background:#fff;color:#C0392B;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit\">Ver consumos →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"font-size:16px;font-weight:800;margin-bottom:14px\">Estado por edificio<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\">\n          <sc-for list=\"{{ duenoBuildings }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <button onclick=\"{{ b.onOpen }}\" style=\"text-align:left;background:#fff;border:1px solid #E7ECF3;border-radius:16px;padding:18px;cursor:pointer;font-family:inherit\" style-hover=\"border-color:#C9D5E8;box-shadow:0 6px 18px -10px rgba(16,35,59,.25)\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\">\n                <span style=\"width:42px;height:42px;border-radius:11px;background:#EAF1FB;display:flex;align-items:center;justify-content:center;font-size:19px\">🏢<\u002Fspan>\n                <span style=\"font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:{{ b.estBg }};color:{{ b.estFg }}\">{{ b.estLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:16px;font-weight:800;letter-spacing:-.01em\">{{ b.name }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#8595AD;margin-bottom:12px\">{{ b.cliente }} · {{ b.tipo }} · {{ b.unidades }} un.<\u002Fdiv>\n              <div style=\"display:flex;gap:16px\">\n                <span style=\"font-size:13px;color:#334259\"><strong style=\"color:#2E6FC0;font-size:15px\">{{ b.nuevos }}<\u002Fstrong> novedades<\u002Fspan>\n                <span style=\"font-size:13px;color:#334259\"><strong style=\"color:#C0392B;font-size:15px\">{{ b.urg }}<\u002Fstrong> urgencias<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ======= DUEÑO · EVENTOS ======= -->\n      <sc-if value=\"{{ secDEventos }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mFade .3s ease both\">\n        <h1 style=\"font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px\">Eventos · {{ duenoFilterLabel }}<\u002Fh1>\n        <p style=\"color:#64748B;font-size:15px;margin:0 0 20px\">Feed de todos los consorcios. Usá el filtro de arriba para acotar por edificio.
